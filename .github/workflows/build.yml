name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: Install build tools
        run: brew install xcodegen ldid

      - name: Verify localization keys
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          keys = set()
          for f in pathlib.Path("Sources").rglob("*.swift"):
              for m in re.finditer(r'(?<![A-Za-z0-9_])L\("((?:[^"\\]|\\.)*)"\)', f.read_text(encoding="utf-8")):
                  keys.add(m.group(1))
          zh = pathlib.Path("Localization/zh-Hans.lproj/Localizable.strings").read_text(encoding="utf-8")
          missing = sorted(k for k in keys if f'"{k}" =' not in zh)
          print("keys used:", len(keys))
          if missing:
              print("MISSING:", missing)
              sys.exit(1)
          print("all keys present")
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Melo.xcodeproj \
            -scheme Melo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet

      - name: Simulator smoke test
        run: |
          set -x
          DEVICE_ID=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "device=$DEVICE_ID"
          if [ -z "$DEVICE_ID" ]; then
            echo "no iPhone simulator found"
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP="build-sim/Build/Products/Debug-iphonesimulator/Melo.app"
          ls -la "$APP"
          echo "--- 语言包是否进了 bundle ---"
          ls -1 "$APP" | grep -E '\.lproj$'
          xcrun simctl install "$DEVICE_ID" "$APP"

          xcrun simctl ui "$DEVICE_ID" appearance light || true

          echo "=== 中文（强制 zh-Hans）==="
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN || true
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot shot-01-home-zh.png

          echo "=== 设置页（验证外观切换控件）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-settings || true
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot shot-02-settings-zh.png

          echo "=== 冒烟播放：验证 直链解析 -> AVPlayer -> 播放页 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-play dQw4w9WgXcQ -smoke-player || true
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot shot-03-miniplayer.png
          sleep 16
          xcrun simctl io "$DEVICE_ID" screenshot shot-04-player.png
          echo "--- 播放相关日志 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 60s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep -iE 'error|fail|denied|AVPlayer' | tail -20 || echo "no error lines"

          echo "=== 英文 + 深色 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl ui "$DEVICE_ID" appearance dark || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(en)' -AppleLocale en_US || true
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot shot-05-english-dark.png

          echo "=== 资料库歌单列表 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl ui "$DEVICE_ID" appearance light || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 3 -smoke-seed-playlist || true
          sleep 10
          xcrun simctl io "$DEVICE_ID" screenshot shot-06-library-playlists.png

          echo "=== 导入歌单页（空表单）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 3 -smoke-import || true
          sleep 12
          xcrun simctl io "$DEVICE_ID" screenshot shot-07-import-playlist.png

          echo "=== 真实导入：QQ音乐 27 首歌单，抓取→匹配→落库 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 3 -smoke-import -smoke-import-url 'https://y.qq.com/n/ryqq/playlist/7013848675' || true
          sleep 55
          xcrun simctl io "$DEVICE_ID" screenshot shot-08-import-result.png
          echo "--- 导入相关日志 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 90s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep -iE 'error|fail|timeout' | tail -15 || echo "no error lines"

          echo "=== 网易云大歌单全量抓取（热歌榜 200 首）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 3 -smoke-import -smoke-import-url 'https://music.163.com/playlist?id=3778678' -smoke-count-only || true
          sleep 22
          xcrun simctl io "$DEVICE_ID" screenshot shot-13-netease-count.png
          echo "--- 抓取样本（核对艺人名是否为空）---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 60s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep 'SMOKE_FETCH' | tail -5 || echo "no sample"

          echo "=== 播放诊断 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 3 -smoke-settings-page -smoke-playback-test || true
          sleep 30
          xcrun simctl io "$DEVICE_ID" screenshot shot-09-playback-diagnostics.png

          echo "=== 真实曲目播放（搜索周杰伦，取第一首）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-play-search '周杰伦' -smoke-player || true
          sleep 30
          xcrun simctl io "$DEVICE_ID" screenshot shot-11-real-song.png

          echo "=== 国内音源播放（网易云直链）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-play-netease 1851652156 -smoke-player || true
          sleep 30
          xcrun simctl io "$DEVICE_ID" screenshot shot-12-domestic-song.png

          echo "=== 搜索点播走国内兜底（YouTube 被拦 -> 网易云同名同艺人）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-play-search '孤勇者' -smoke-player || true
          sleep 32
          xcrun simctl io "$DEVICE_ID" screenshot shot-14-search-fallback.png

          echo "=== 搜索页双源结果（YouTube + 国内音源）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-search '孤勇者' || true
          sleep 26
          xcrun simctl io "$DEVICE_ID" screenshot shot-15-search-domestic.png
          echo "--- 搜索双源计数 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 60s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep 'SMOKE_SEARCH' | tail -3 || echo "no sample"

          echo "=== 播放失败态（故意用无效视频）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-play AAAAAAAAAAA -smoke-player || true
          sleep 26
          xcrun simctl io "$DEVICE_ID" screenshot shot-10-playback-error.png

          echo "--- process check ---"
          xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -i melo || echo "process not listed"

      - name: Downscale screenshots
        if: always()
        run: |
          mkdir -p shots
          for f in shot-01-home-zh.png shot-02-settings-zh.png shot-03-miniplayer.png shot-04-player.png shot-05-english-dark.png shot-06-library-playlists.png shot-07-import-playlist.png shot-08-import-result.png shot-09-playback-diagnostics.png shot-10-playback-error.png shot-11-real-song.png shot-12-domestic-song.png shot-13-netease-count.png shot-14-search-fallback.png shot-15-search-domestic.png; do
            if [ -f "$f" ]; then
              sips -Z 1400 "$f" --out "shots/$f" >/dev/null
            fi
          done
          ls -lh shots || true

      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild \
            -project Melo.xcodeproj \
            -scheme Melo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-dev \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} \
            build -quiet

      - name: Fakesign
        run: |
          APP=$(find build-dev/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app')
          test -n "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "--- 主二进制 ---"
          ldid -S "$APP/Melo"
          echo "--- 架构 ---"
          lipo -archs "$APP/Melo"
          echo "--- Info.plist 关键项 ---"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDevelopmentRegion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' "$APP/Info.plist"
          echo "--- 本地化资源（缺一个就构建失败）---"
          ls -1 "$APP" | grep -E '\.lproj$'
          test -f "$APP/en.lproj/Localizable.strings"
          test -f "$APP/zh-Hans.lproj/Localizable.strings"
          echo "本地化资源齐全"

      - name: Package IPA
        id: pkg
        run: |
          APP="$APP_PATH"
          IPA_NAME="Melo-v1.9.0.B${GITHUB_RUN_NUMBER}.ipa"
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$IPA_NAME" Payload
          rm -rf Payload
          test -s "$IPA_NAME"
          ls -lh "$IPA_NAME"
          echo "--- 内容 ---"
          unzip -l "$IPA_NAME" | head -25

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melo-build
          path: |
            Melo-v1.9.0.B*.ipa
            shots/shot-01-home-zh.png
            shots/shot-02-settings-zh.png
            shots/shot-03-miniplayer.png
            shots/shot-04-player.png
            shots/shot-05-english-dark.png
            shots/shot-06-library-playlists.png
            shots/shot-07-import-playlist.png
            shots/shot-08-import-result.png
            shots/shot-09-playback-diagnostics.png
            shots/shot-10-playback-error.png
            shots/shot-11-real-song.png
            shots/shot-12-domestic-song.png
            shots/shot-13-netease-count.png
            shots/shot-14-search-fallback.png
            shots/shot-15-search-domestic.png
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Melo build ${{ github.run_number }}
          body: |
            未签名 IPA，iOS 15.0+，用 TrollStore 安装。
            界面语言跟随系统（简体中文 / English），设置内可切换 跟随系统 / 浅色 / 深色。
          files: |
            ${{ env.IPA_NAME }}
            shots/shot-01-home-zh.png
            shots/shot-02-settings-zh.png
            shots/shot-03-miniplayer.png
            shots/shot-04-player.png
            shots/shot-05-english-dark.png
            shots/shot-06-library-playlists.png
            shots/shot-07-import-playlist.png
            shots/shot-08-import-result.png
            shots/shot-09-playback-diagnostics.png
            shots/shot-10-playback-error.png
            shots/shot-11-real-song.png
            shots/shot-12-domestic-song.png
            shots/shot-13-netease-count.png
            shots/shot-14-search-fallback.png
            shots/shot-15-search-domestic.png
          draft: false
          prerelease: true
          generate_release_notes: false

      # CI 里不要加发邮件：macOS runner 在 Azure 上，平台封禁出站 SMTP，
      # 投递由本机脚本负责。
