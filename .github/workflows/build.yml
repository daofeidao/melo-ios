name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: Install build tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Melo.xcodeproj \
            -scheme Melo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet

      - name: Simulator smoke test
        run: |
          set -x
          DEVICE_ID=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "device=$DEVICE_ID"
          if [ -z "$DEVICE_ID" ]; then
            echo "no iPhone simulator found"
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP="build-sim/Build/Products/Debug-iphonesimulator/Melo.app"
          ls -la "$APP"
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo || true
          sleep 15
          xcrun simctl io "$DEVICE_ID" screenshot shot-01-listennow.png

          echo "=== 冒烟播放：验证 直链解析 -> AVPlayer -> 播放页 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -smoke-play dQw4w9WgXcQ -smoke-player || true
          sleep 22
          xcrun simctl io "$DEVICE_ID" screenshot shot-02-player.png
          echo "--- 播放相关日志 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 60s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep -iE 'error|fail|denied|AVPlayer' | tail -20 || echo "no error lines"
          echo "--- process check ---"
          xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -i melo || echo "process not listed"

      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild \
            -project Melo.xcodeproj \
            -scheme Melo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-dev \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} \
            build -quiet

      - name: Fakesign
        run: |
          APP=$(find build-dev/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app')
          test -n "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "--- 主二进制 ---"
          ldid -S "$APP/Melo"
          echo "--- 架构 ---"
          lipo -archs "$APP/Melo"
          echo "--- Info.plist 关键项 ---"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist"

      - name: Package IPA
        id: pkg
        run: |
          APP="$APP_PATH"
          IPA_NAME="Melo-v1.0.0.B${GITHUB_RUN_NUMBER}.ipa"
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$IPA_NAME" Payload
          rm -rf Payload
          test -s "$IPA_NAME"
          ls -lh "$IPA_NAME"
          echo "--- 内容 ---"
          unzip -l "$IPA_NAME" | head -20

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melo-build
          path: |
            Melo-v1.0.0.B*.ipa
            shot-01-listennow.png
            shot-02-player.png
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Melo build ${{ github.run_number }}
          body: |
            未签名 IPA，iOS 15.0+，用 TrollStore 安装。
          files: |
            ${{ env.IPA_NAME }}
          draft: false
          prerelease: true
          generate_release_notes: false

      # CI 里不要加发邮件：macOS runner 在 Azure 上，平台封禁出站 SMTP，
      # 投递由本机脚本负责。
