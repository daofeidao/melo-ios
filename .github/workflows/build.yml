name: Build IPA

on:
  workflow_dispatch:
    inputs:
      full_smoke:
        description: "跑全套冒烟测试并出截图（约 +8 分钟）"
        type: boolean
        default: false
      publish:
        description: "发布 GitHub Release"
        type: boolean
        default: true
      verify_only:
        description: "只做编译验证（模拟器构建 + 本地化校验），不打包 IPA、不发布"
        type: boolean
        default: false

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-xcodegen-ldid

      - name: Install build tools
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v ldid >/dev/null || brew install ldid

      - name: Verify localization keys
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          keys = set()
          for f in pathlib.Path("Sources").rglob("*.swift"):
              for m in re.finditer(r'(?<![A-Za-z0-9_])L\("((?:[^"\\]|\\.)*)"\)', f.read_text(encoding="utf-8")):
                  keys.add(m.group(1))
          zh = pathlib.Path("Localization/zh-Hans.lproj/Localizable.strings").read_text(encoding="utf-8")
          missing = sorted(k for k in keys if f'"{k}" =' not in zh)
          print("keys used:", len(keys))
          if missing:
              print("MISSING:", missing)
              sys.exit(1)
          print("all keys present")
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        if: inputs.full_smoke == true || inputs.verify_only == true
        run: |
          set -o pipefail
          xcodebuild \
            -project Melo.xcodeproj \
            -scheme Melo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet

      # verify_only：只跑新增功能的定向冒烟，不出 IPA、不跑 20 张截图那套长流程
      - name: Verify new UI (settings pages + chart cache)
        if: inputs.verify_only == true && inputs.full_smoke == false
        run: |
          set -x
          DEVICE_ID=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "device=$DEVICE_ID"
          if [ -z "$DEVICE_ID" ]; then echo "no iPhone simulator found"; exit 1; fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP="build-sim/Build/Products/Debug-iphonesimulator/Melo.app"
          xcrun simctl install "$DEVICE_ID" "$APP"
          mkdir -p shots

          echo "=== 版本更新记录（版本号彩蛋页）==="
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-changelog || true
          sleep 9
          xcrun simctl io "$DEVICE_ID" screenshot shots/shot-20-changelog.png

          echo "=== 数据来源页 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-data-sources || true
          sleep 9
          xcrun simctl io "$DEVICE_ID" screenshot shots/shot-21-data-sources.png

          echo "=== 榜单缓存 / 酷狗封面 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-chart-cache -smoke-tab 1 || true
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot shots/shot-22-charts.png

          echo "=== 收藏的歌单与专辑（现在就听）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-seed-collections || true
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot shots/shot-23-saved-collections.png

          echo "--- 关键日志 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 90s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep -E 'SMOKE_ABOUT|SMOKE_CHART_CACHE|SMOKE_CHART_COVERS|SMOKE_COLLECTIONS' | tail -10 || echo "no sample"
          echo "--- 进程是否存活 ---"
          if xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -qi melo; then echo alive; else echo "NOT RUNNING (crashed)"; exit 1; fi

      # 应用起不来时，把崩溃报告打出来，省得靠猜
      - name: Dump crash reports
        if: always()
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "--- 最近的崩溃报告 ---"
          ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -8 || echo "none"
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Melo* 2>/dev/null | head -2); do
            echo "=== $f ==="
            head -c 5000 "$f" || true
            echo
          done
          echo "--- 应用最后 3 分钟日志 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 3m --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | tail -40 || true
          echo "--- 动态库依赖（看 libswiftWebKit 是不是 weak）---"
          APP="build-sim/Build/Products/Debug-iphonesimulator/Melo.app"
          otool -L "$APP/Melo" 2>/dev/null | grep -i 'swift' || echo "main: no swift libs"
          otool -L "$APP/Melo.debug.dylib" 2>/dev/null | grep -i 'swift' || echo "debug dylib: none"
          otool -l "$APP/Melo.debug.dylib" 2>/dev/null | grep -A2 -i 'swiftWebKit' | head -20 || true

      # 验证「App 内嵌 WebKit 能不能让 YouTube 网页自己交出可播地址」。
      # runner 在境外，直连 youtube.com，所以这一页能拿到真实结果。
      - name: Verify YouTube web probe (WKWebView)
        if: inputs.verify_only == true && inputs.full_smoke == false
        run: |
          set -x
          DEVICE_ID=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "device=$DEVICE_ID"
          if [ -z "$DEVICE_ID" ]; then echo "no iPhone simulator found"; exit 1; fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          mkdir -p shots

          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo \
            -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN \
            -smoke-yt-web -smoke-yt-web-id dQw4w9WgXcQ || true
          # 页面加载 + 等 player response + 跑半验证，留足 80 秒
          sleep 80
          xcrun simctl io "$DEVICE_ID" screenshot shots/shot-24-yt-web.png

          echo "--- 页面探测 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 200s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null \
            | grep 'SMOKE_YT_WEB' | tail -2 || echo "no yt-web sample"
          echo "--- PO Token 半验证 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 200s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null \
            | grep 'SMOKE_YT_POT' | tail -12 || echo "no yt-pot sample"
          echo "--- 进程是否存活 ---"
          if xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -qi melo; then echo alive; else echo "NOT RUNNING (crashed)"; exit 1; fi

      - name: Simulator smoke test
        if: inputs.full_smoke == true
        run: |
          set -x
          DEVICE_ID=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "device=$DEVICE_ID"
          if [ -z "$DEVICE_ID" ]; then
            echo "no iPhone simulator found"
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP="build-sim/Build/Products/Debug-iphonesimulator/Melo.app"
          ls -la "$APP"
          echo "--- 语言包是否进了 bundle ---"
          ls -1 "$APP" | grep -E '\.lproj$'
          xcrun simctl install "$DEVICE_ID" "$APP"

          xcrun simctl ui "$DEVICE_ID" appearance light || true

          echo "=== 中文（强制 zh-Hans）==="
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-seed-favorites || true
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot shot-01-home-zh.png

          echo "=== 设置页（验证外观切换控件）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-settings || true
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot shot-02-settings-zh.png

          echo "=== 冒烟播放：验证 直链解析 -> AVPlayer -> 播放页 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-play dQw4w9WgXcQ -smoke-player -smoke-no-autoplayer || true
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot shot-03-miniplayer.png
          sleep 16
          xcrun simctl io "$DEVICE_ID" screenshot shot-04-player.png
          echo "--- 播放相关日志 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 60s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep -iE 'error|fail|denied|AVPlayer' | tail -20 || echo "no error lines"

          echo "=== 英文 + 深色 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl ui "$DEVICE_ID" appearance dark || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(en)' -AppleLocale en_US || true
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot shot-05-english-dark.png

          echo "=== 资料库歌单列表 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl ui "$DEVICE_ID" appearance light || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 2 -smoke-seed-playlist || true
          sleep 10
          xcrun simctl io "$DEVICE_ID" screenshot shot-06-library-playlists.png

          echo "=== 导入歌单页（空表单）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 2 -smoke-import || true
          sleep 12
          xcrun simctl io "$DEVICE_ID" screenshot shot-07-import-playlist.png

          echo "=== 真实导入：QQ音乐 27 首歌单，抓取→匹配→落库 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 2 -smoke-import -smoke-import-url 'https://y.qq.com/n/ryqq/playlist/7013848675' || true
          sleep 55
          xcrun simctl io "$DEVICE_ID" screenshot shot-08-import-result.png
          echo "--- 导入相关日志 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 90s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep -iE 'error|fail|timeout' | tail -15 || echo "no error lines"

          echo "=== 网易云大歌单全量抓取（热歌榜 200 首）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 2 -smoke-import -smoke-import-url 'https://music.163.com/playlist?id=3778678' -smoke-count-only || true
          sleep 22
          xcrun simctl io "$DEVICE_ID" screenshot shot-13-netease-count.png
          echo "--- 抓取样本（核对艺人名是否为空）---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 60s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep 'SMOKE_FETCH' | tail -5 || echo "no sample"

          echo "=== 播放诊断 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 2 -smoke-settings-page -smoke-playback-test -smoke-backup || true
          sleep 30
          xcrun simctl io "$DEVICE_ID" screenshot shot-09-playback-diagnostics.png
          echo "--- 备份往返 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 40s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep 'SMOKE_BACKUP' | tail -2 || echo "no backup sample"
          echo "--- 排行榜预热 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 40s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep 'SMOKE_CHART' | tail -4 || echo "no chart sample"

          echo "=== 真实曲目播放（搜索周杰伦，取第一首）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-play-search '周杰伦' -smoke-player || true
          sleep 30
          xcrun simctl io "$DEVICE_ID" screenshot shot-11-real-song.png

          echo "=== 国内音源播放（网易云直链）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-play-netease 1851652156 -smoke-player || true
          sleep 30
          xcrun simctl io "$DEVICE_ID" screenshot shot-12-domestic-song.png

          echo "=== 搜索点播走国内兜底（YouTube 被拦 -> 网易云同名同艺人）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-play-search '孤勇者' -smoke-player || true
          sleep 32
          xcrun simctl io "$DEVICE_ID" screenshot shot-14-search-fallback.png

          echo "=== 搜索页双源结果（YouTube + 国内音源）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-search '孤勇者' || echo "launch failed rc=$?"
          sleep 28
          xcrun simctl io "$DEVICE_ID" screenshot shot-15-search-domestic.png
          echo "--- 进程是否存活 ---"
          if xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -qi melo; then echo "alive"; else echo "NOT RUNNING (crashed)"; fi
          echo "--- 搜索双源计数 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 60s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep 'SMOKE_SEARCH' | tail -3 || echo "no sample"
          echo "--- 崩溃报告 ---"
          for CRASH in $(ls -t ~/Library/Logs/DiagnosticReports/*Melo*.ips 2>/dev/null | head -3); do
            echo "===== $(basename "$CRASH") ====="
            python3 scripts/parse_crash.py "$CRASH" || true
          done
          echo "=== 排行榜 · 酷狗榜单 ==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 1 -smoke-kugou || true
          sleep 20
          xcrun simctl io "$DEVICE_ID" screenshot shot-18-charts-kugou.png
          echo "--- 酷狗榜单日志 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 40s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep 'SMOKE_KUGOU_CHART' | tail -2 || echo "no kugou sample"

          echo "=== 搜索空态（按风格浏览）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-tab 3 || true
          sleep 12
          xcrun simctl io "$DEVICE_ID" screenshot shot-16-search-genres.png

          echo "=== 风格分类直接播（不依赖代理）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-play-genre '摇滚' || true
          sleep 26
          xcrun simctl io "$DEVICE_ID" screenshot shot-17-genre-play.png
          echo "--- 分类日志 ---"
          xcrun simctl spawn "$DEVICE_ID" log show --last 40s --style compact \
            --predicate 'processImagePath CONTAINS "Melo"' 2>/dev/null | grep 'SMOKE_GENRE' | tail -3 || echo "no genre sample"

          echo "=== 播放失败态（故意用无效视频）==="
          xcrun simctl terminate "$DEVICE_ID" com.daofeidao.melo || true
          xcrun simctl launch "$DEVICE_ID" com.daofeidao.melo -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN -smoke-play AAAAAAAAAAA -smoke-player || true
          sleep 26
          xcrun simctl io "$DEVICE_ID" screenshot shot-10-playback-error.png

          echo "--- process check ---"
          xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -i melo || echo "process not listed"

      - name: Downscale screenshots
        if: always() && inputs.full_smoke == true
        run: |
          mkdir -p shots
          for f in shot-*.png; do
            if [ -f "$f" ]; then
              sips -Z 1400 "$f" --out "shots/$f" >/dev/null
            fi
          done
          ls -lh shots || true

      - name: Build for device
        if: inputs.verify_only == false
        run: |
          set -o pipefail
          xcodebuild \
            -project Melo.xcodeproj \
            -scheme Melo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-dev \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} \
            build -quiet

      - name: Fakesign
        if: inputs.verify_only == false
        run: |
          APP=$(find build-dev/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app')
          test -n "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "--- 主二进制 ---"
          ldid -S "$APP/Melo"
          echo "--- 架构 ---"
          lipo -archs "$APP/Melo"
          echo "--- Info.plist 关键项 ---"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDevelopmentRegion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' "$APP/Info.plist"
          echo "--- 版本一致性（写死 Info.plist 会让安装后显示旧版本）---"
          EXPECTED_VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([0-9]+(\.[0-9]+)*)".*/\1/')
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          echo "plist: ${ACTUAL_VERSION} (${ACTUAL_BUILD}) / 期望: ${EXPECTED_VERSION} (${GITHUB_RUN_NUMBER})"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::CFBundleShortVersionString=${ACTUAL_VERSION}，与 MARKETING_VERSION=${EXPECTED_VERSION} 不一致"
            exit 1
          fi
          if [ "$ACTUAL_BUILD" != "${GITHUB_RUN_NUMBER}" ]; then
            echo "::error::CFBundleVersion=${ACTUAL_BUILD}，与构建号=${GITHUB_RUN_NUMBER} 不一致"
            exit 1
          fi
          echo "版本一致"
          echo "--- 本地化资源（缺一个就构建失败）---"
          ls -1 "$APP" | grep -E '\.lproj$'
          test -f "$APP/en.lproj/Localizable.strings"
          test -f "$APP/zh-Hans.lproj/Localizable.strings"
          echo "本地化资源齐全"

      - name: Package IPA
        id: pkg
        if: inputs.verify_only == false
        run: |
          APP="$APP_PATH"
          # 版本号只认 project.yml，避免改名时漏改工作流
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([0-9]+(\.[0-9]+)*)".*/\1/')
          : "${VERSION:=0.0.0}"
          IPA_NAME="Melo-v${VERSION}.B${GITHUB_RUN_NUMBER}.ipa"
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$IPA_NAME" Payload
          rm -rf Payload
          test -s "$IPA_NAME"
          ls -lh "$IPA_NAME"
          echo "--- 内容 ---"
          unzip -l "$IPA_NAME" | head -25

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melo-build
          path: |
            Melo-v*.ipa
            shots/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Collect release assets
        if: success() && inputs.publish == true && inputs.verify_only == false
        run: |
          {
            echo "RELEASE_FILES<<EOF"
            echo "${IPA_NAME}"
            if [ "${{ inputs.full_smoke }}" = "true" ] && [ -d shots ]; then
              for f in shots/*.png; do
                if [ -f "$f" ]; then echo "$f"; fi
              done
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish release
        if: success() && inputs.publish == true && inputs.verify_only == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Melo build ${{ github.run_number }}
          body: |
            未签名 IPA，iOS 15.0+，用 TrollStore 安装。
            界面语言跟随系统（简体中文 / English），设置内可切换 跟随系统 / 浅色 / 深色。
          files: |
            ${{ env.RELEASE_FILES }}
          draft: false
          prerelease: true
          generate_release_notes: false

      # CI 里不要加发邮件：macOS runner 在 Azure 上，平台封禁出站 SMTP，
      # 投递由本机脚本负责。
